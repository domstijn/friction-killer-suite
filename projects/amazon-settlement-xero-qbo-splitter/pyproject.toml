[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-settlement-xero-qbo-splitter"
version = "0.1.0"
description = "AmzSettlementBridge: Zero-Install Amazon Seller Flat-File V2 (.TXT/.TSV) to Xero, QuickBooks & DATEV Clearing Journal Compiler"
requires-python = ">=3.10"

[project.scripts]
amazon-settlement-xero-qbo-splitter = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "addon", "license_client"]
