<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NotionGuestBridge</title>
  <style>
    body {
      width: 350px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
    }
    h3 { margin: 0 0 10px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
    .badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: #1e293b; color: #94a3b8; }
    .badge.pro { background: #312e81; color: #a5b4fc; }
    label { display: block; margin-top: 8px; font-size: 11px; color: #94a3b8; }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      margin-top: 4px;
      padding: 7px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 12px;
    }
    textarea { min-height: 92px; resize: vertical; font-family: ui-monospace, monospace; }
    .toggle { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: #cbd5e1; }
    .toggle input { width: auto; margin: 0; }
    .row { display: flex; gap: 6px; margin-top: 8px; }
    button {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .primary { background: #4f46e5; color: #fff; }
    .secondary { background: #334155; color: #f8fafc; }
    #status { margin-top: 10px; font-size: 12px; color: #a5b4fc; min-height: 16px; }
  </style>
</head>
<body>
  <h3>
    NotionGuestBridge
    <span id="tier-badge" class="badge">Free Tier (3/day)</span>
  </h3>

  <label class="toggle">
    <input id="redact-pii" type="checkbox" />
    <span>Scrub client emails &amp; API tokens (Pro)</span>
  </label>

  <label for="context-preview">Extracted Markdown / .mcp-context.json</label>
  <textarea id="context-preview" placeholder="Open any client Notion guest page and click Extract..."></textarea>

  <div class="row">
    <button id="extract-btn" class="primary">Extract Guest Page</button>
    <button id="copy-btn" class="secondary">Copy Output</button>
  </div>
  <div class="row">
    <button id="queue-btn" class="secondary">+ Queue (Pro)</button>
    <button id="export-btn" class="secondary">Export MCP JSON (Pro)</button>
  </div>

  <label for="license-key">Stripe Pro License Key</label>
  <div class="row" style="margin-top:4px">
    <input id="license-key" placeholder="Paste cs_live_... session key" style="margin-top:0" />
    <button id="activate-btn" class="secondary" style="flex:0 0 88px">Activate</button>
  </div>

  <p id="status"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
