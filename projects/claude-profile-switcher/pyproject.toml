[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-profile-switcher"
version = "0.1.0"
description = "ClaudeProfileSwitch: Multi-Account, MCP Profile & Quota Guard for Claude Code"
requires-python = ">=3.10"

[project.scripts]
claude-profile-switch = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "profile_manager", "license_client"]
